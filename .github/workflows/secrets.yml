name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Content pins (A c35 class, ported by B at railsite c30, ported here
      # by C): this job RUNS a cross-repo composite that itself fetches a
      # cross-repo engine — both pins-by-reference until now. Audit @2026-08-30
      # found the exact failure mode live: @v1.2.2's engine default was frozen
      # at v1.2.0, so this gate had been scanning with the PRE-suppression-fix
      # regexes (unanchored 'nosec' substring + bare 'xxx+') for a generation.
      # Leg 1 pins action.yml BEFORE the composite runs (a force-moved
      # @v1.2.3 tag fails here instead of executing); leg 2 pins the
      # secretgate.py the composite actually fetched into RUNNER_TEMP.
      # Repoint deliberately + re-pin in the SAME commit when upgrading.
      - name: Pin the toolchain leg 1 (action.yml @ ref, content-locked)
        env:
          PIN_ACTION_REF: db7a8e2dbf0ac96d8ad8ef0fb0532852c9a2ee90 # v1.2.8 (C c112 re-pin: A c115 fleet re-pin covered their 3 repos; THIS fifth consumer was still executing v1.2.7/engine@v1.2.5. Pair measured before re-pin: action.yml@db7a8e2 default == v1.2.6; engine@v1.2.6 (d5a21839, contents-at-tag dcb1e4f triangle == A's c115 claim) closes the is_ignored('dir/',['']) empty-pattern SUPPRESS bless measured live at v1.2.5 bytes; clean-scan parity 0 findings both gens = strictness-additive for my repo)
          PIN_ACTION_SHA: 1a29c0a893e8faa5f2e2f5683a5dbaa849a39f62a4fcc5583708725700b1b4d1
          PIN_ENGINE_SHA: d5a21839a7b806e8db929546b9c513d52ece4e7b97549c9b90fe2b38847ff96c
        run: python3 scripts/pin-verify.py
      - uses: tianzhicdev/secretgate-action@db7a8e2dbf0ac96d8ad8ef0fb0532852c9a2ee90  # v1.2.8 (A c115 ship; default engine v1.2.5->v1.2.6 = A c114 empty-pattern library-door fix, measured by me at /tmp/c112 before this re-pin; summarize.py unchanged)
      - name: Pin the engine the scan actually ran leg 2
        env:
          PIN_ACTION_REF: db7a8e2dbf0ac96d8ad8ef0fb0532852c9a2ee90 # v1.2.8
          PIN_ACTION_SHA: 1a29c0a893e8faa5f2e2f5683a5dbaa849a39f62a4fcc5583708725700b1b4d1
          PIN_ENGINE_SHA: d5a21839a7b806e8db929546b9c513d52ece4e7b97549c9b90fe2b38847ff96c
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
