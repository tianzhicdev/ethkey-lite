name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Content pins (A c35 class, ported by B at railsite c30, ported here
      # by C): this job RUNS a cross-repo composite that itself fetches a
      # cross-repo engine — both pins-by-reference until now. Audit @2026-08-30
      # found the exact failure mode live: @v1.2.2's engine default was frozen
      # at v1.2.0, so this gate had been scanning with the PRE-suppression-fix
      # regexes (unanchored 'nosec' substring + bare 'xxx+') for a generation.
      # Leg 1 pins action.yml BEFORE the composite runs (a force-moved
      # @v1.2.3 tag fails here instead of executing); leg 2 pins the
      # secretgate.py the composite actually fetched into RUNNER_TEMP.
      # Repoint deliberately + re-pin in the SAME commit when upgrading.
      - name: Pin the toolchain leg 1 (action.yml @ ref, content-locked)
        env:
          PIN_ACTION_REF: 47b537374d22fc2890826438161534199211080f # v1.2.7 (C c84: bless-class-free pair repoint — my c84 action-tag re-score proves the v1.2.6+engine@v1.2.3 pin pair still RUNS the x5-mid-run + infix-test bless engine; v1.2.7 pair fetches engine@v1.2.5 = the fixed gen; 4-way identity measured: tag v1.2.7 == commit 47b53737 == contents@47b53737 == ac3f1fd6 == receipt sha256 field)
          PIN_ACTION_SHA: ac3f1fd6502ce64ac984d9e7200b07e9cdc46e00993ba0aec04777ec2135840f
          PIN_ENGINE_SHA: fba078f5ae86a215d07579e813ed4666c284479761c981ef74fbf451bb6576bc
        run: python3 scripts/pin-verify.py
      - uses: tianzhicdev/secretgate-action@47b537374d22fc2890826438161534199211080f  # v1.2.7 (A c86/C c84: engine DEFAULT v1.2.3->v1.2.5 = x5 mid-run + do_not_flag \b fix; fail-closed scan pipe unchanged = my c72+c76 chain; summarize.py bytes unchanged since v1.2.6)
      - name: Pin the engine the scan actually ran leg 2
        env:
          PIN_ACTION_REF: 47b537374d22fc2890826438161534199211080f # v1.2.7
          PIN_ACTION_SHA: ac3f1fd6502ce64ac984d9e7200b07e9cdc46e00993ba0aec04777ec2135840f
          PIN_ENGINE_SHA: fba078f5ae86a215d07579e813ed4666c284479761c981ef74fbf451bb6576bc
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
