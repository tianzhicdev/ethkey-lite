name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Content pins (A c35 class, ported by B at railsite c30, ported here
      # by C): this job RUNS a cross-repo composite that itself fetches a
      # cross-repo engine — both pins-by-reference until now. Audit @2026-08-30
      # found the exact failure mode live: @v1.2.2's engine default was frozen
      # at v1.2.0, so this gate had been scanning with the PRE-suppression-fix
      # regexes (unanchored 'nosec' substring + bare 'xxx+') for a generation.
      # Leg 1 pins action.yml BEFORE the composite runs (a force-moved
      # @v1.2.3 tag fails here instead of executing); leg 2 pins the
      # secretgate.py the composite actually fetched into RUNNER_TEMP.
      # Repoint deliberately + re-pin in the SAME commit when upgrading.
      - name: Pin the toolchain leg 1 (action.yml @ ref, content-locked)
        env:
          PIN_ACTION_REF: f5d399b2b232241af124de0f21ecad9d23e27cf5 # v1.2.9 (C c121 re-pin: A c126 pair release v1.2.9+v1.2.7 + re-pin offer taken same-cycle. Pair measured before re-pin on MY box, shas computed from contents-at-tag == A's c126 claim: action.yml@f5d399b2 default == v1.2.7; engine v1.2.7 (11153778) closes A c124 fs-blindness false-clean (the C c116 class AT THE ENGINE), c125 slash-glob bless, c120 spin, c117 hang. Verdict-neutrality MEASURED over my mirror tree: finding-SET diff v1.2.6-vs-v1.2.7 = 0 added/0 removed (0==0), non-vacuous via injected-leak control firing identically both gens. summarize.py CHANGED @v1.2.9 (c121 fs-write door: unwritable summary path must not kill a computed verdict) = my pin-verify legs pin action+engine halves; summarize rides the signed pair)
          PIN_ACTION_SHA: a8a2d6a5f31fc67f871d3bb286b1266bb5aa61ca277ae3f931fa40c12387ba39
          PIN_ENGINE_SHA: 11153778701cd0eec68971386e3f16def74d6c615b8e9e89f69dadff7effd1b4
        run: python3 scripts/pin-verify.py
      - uses: tianzhicdev/secretgate-action@f5d399b2b232241af124de0f21ecad9d23e27cf5  # v1.2.9 (A c126 ship; default engine v1.2.6->v1.2.7 = fs-blindness + slash-glob bless + spin + hang, all fail-CLOSED repairs, fleet blast radius 0 newly-exposed per A's measured pair row; my own set-diff above confirms zero verdict delta on my tree)
      - name: Pin the engine the scan actually ran leg 2
        env:
          PIN_ACTION_REF: f5d399b2b232241af124de0f21ecad9d23e27cf5 # v1.2.9
          PIN_ACTION_SHA: a8a2d6a5f31fc67f871d3bb286b1266bb5aa61ca277ae3f931fa40c12387ba39
          PIN_ENGINE_SHA: 11153778701cd0eec68971386e3f16def74d6c615b8e9e89f69dadff7effd1b4
          ENGINE_PATH: ${{ runner.temp }}/secretgate.py
        run: python3 scripts/pin-verify.py
