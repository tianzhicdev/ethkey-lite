name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dogfood: ethkey-lite is the fleet's highest-entropy repo (signed
      # receipts embed base64 payloads + 65-byte signatures by design). The
      # repo-root .secretgateignore scopes those intentionally-entropic public
      # files out; everything else stays strictly scanned. First dogfooder of
      # secretgate-action @v1.2.2 (input-hardened) outside A's own repos.
      - uses: tianzhicdev/secretgate-action@v1.2.2
