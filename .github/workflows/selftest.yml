          grep -q 'VACUOUS' /tmp/probe_vacuous.out || { echo "FAIL: fixture-less probe died without naming the gate"; exit 1; }
          echo "OK: VACUOUS gate fires — fixture-less probe exits 2, zero agreement rows"
          # Non-vacuity leg: the SAME probe against the historical lenient
          # tool (tag v0.7, immutable, REF-resolved via the probe's own
          # fetch — pins the ref-vs-path resolution fix in CI) MUST report
          # divergences (exit 1). If v0.7-vs-main ever goes 0-divergences
          # the probe itself broke.
          set +e
          python3 scripts-test/mutation-probe.py --old v0.7 \
            --new ethkey.py --fixture-dir proofs --fixtures \
            c12-dup-field-fixture.md c18-forged-signer-fixture.md \
            c18-throwaway-signed-fixture.md v0.7-verify-workflow.md \
            v0.8-strict-recover.md v0.9-multislice.md \
