name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogfood:
    runs-on: ubuntu-latest
    env:
      # Well-known public test key (all 0x46 bytes). Safe to expose: it is a
      # published test vector, not a real key.
      ETHKEY_PK: "0x4646464646464646464646464646464646464646464646464646464646464646"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependency
        run: pip install pycryptodome

      - name: Run built-in selftest
        run: python3 ethkey.py selftest

      - name: Sign / recover round-trip
        run: |
          set -euo pipefail
          MSG='CI roundtrip'
          SIG=$(python3 ethkey.py sign "$MSG")
          echo "signature: $SIG"
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          echo "address: $ADDR"
          # recover exits 0 when the claimed address matches, 1 when it does not
          python3 ethkey.py recover "$ADDR" "$MSG" "$SIG"
          # negative control: recovering against a wrong address must fail (exit 1)
          if python3 ethkey.py recover "0x0000000000000000000000000000000000000000" "$MSG" "$SIG"; then
            echo "FAIL: recover matched a wrong address"
            exit 1
          fi
          echo "round-trip and negative control OK"

      - name: Cross-check signatures against ethers.js v6
        run: |
          set -euo pipefail
          MSG='CI roundtrip'
          SIG=$(python3 ethkey.py sign "$MSG")
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          node -e 'const { ethers } = require("ethers");
            const [msg, sig, addr] = process.argv.slice(1);
            const recovered = ethers.verifyMessage(msg, sig);
            console.log("ethers.verifyMessage:", recovered);
            if (recovered.toLowerCase() !== addr.toLowerCase()) {
              console.error("FAIL: ethers recovered", recovered, "expected", addr);
              process.exit(1);
            }
            console.log("ethers.js v6 cross-check OK");' "$MSG" "$SIG" "$ADDR"

      - name: Signed proof round-trip + ethers cross-check
        run: |
          set -euo pipefail
          python3 ethkey.py proof --file ethkey.py --note "CI proof" --out proof.md
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          python3 ethkey.py verify proof.md --require "$ADDR"
          # negative control: tamper with payload -> verify must exit 1
          python3 - <<'EOF'
          import re, subprocess, sys
          md = open('proof.md').read()
          m = re.search(r'-----BEGIN PAYLOAD-----\n(.*?)-----END PAYLOAD-----', md, re.S)
          body = m.group(1).replace('\n', '')
          body = body[:-4] + ('A' if body[-1] != 'A' else 'B') + body[-4:]
          open('proof.md','w').write(md.replace(m.group(1), body))
          EOF
          if python3 ethkey.py verify proof.md; then
            echo "FAIL: tampered proof verified"
            exit 1
          fi
          # ethers cross-check of the untampered signature over the canonical string
          rm proof.md
          python3 ethkey.py proof --file ethkey.py --note "CI proof" --out proof.md
          PROOF=$PWD/proof.md
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          node -e 'const { ethers } = require("ethers");
            const fs = require("fs");
            const md = fs.readFileSync(process.argv[1], "utf8");
            const g = (k) => md.match(new RegExp("^" + k + ": (.+)$", "m"))[1].trim();
            const canon = `ethkey-lite-proof v1\ncreated:${g("created")}\nsha256:${g("sha256")}`;
            const rec = ethers.verifyMessage(canon, g("signature"));
            console.log("ethers proof signer:", rec);
            if (rec.toLowerCase() !== g("signer").toLowerCase()) {
              console.error("FAIL: ethers proof signer mismatch");
              process.exit(1);
            }
            console.log("ethers proof cross-check OK");' "$PROOF"

      - name: CLI argument validation (no tracebacks, documented exit codes)
        run: |
          set -euo pipefail
          # help flags must print help and exit 0 (never crash)
          for a in "--help" "-h" "verify --help" "verify -h" "proof --help"; do
            python3 ethkey.py $a >/dev/null
          done
          # option flag with no value -> exit 2 with a clean error, no traceback
          for a in "proof hello --out" "verify nope.md --require"; do
            set +e
            ERR=$(python3 ethkey.py $a 2>&1 >/dev/null); code=$?
            set -e
            [ "$code" -eq 2 ] || { echo "FAIL: '$a' exited $code, expected 2"; exit 1; }
            case "$ERR" in *Traceback*) echo "FAIL: '$a' printed a traceback"; exit 1;; esac
            echo "OK: '$a' -> exit 2, no traceback"
          done
          # missing file -> exit 1 with clean error, no traceback
          set +e
          ERR=$(python3 ethkey.py verify no-such-file.md 2>&1 >/dev/null); code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "FAIL: missing file exited $code, expected 1"; exit 1; }
          case "$ERR" in *Traceback*) echo "FAIL: missing file printed a traceback"; exit 1;; esac
          echo "OK: missing file -> exit 1, no traceback"

      - name: Duplicate-header-field forgery matrix (first-wins parse audit)
        run: |
          set -euo pipefail
          # First-wins setdefault parse must never let a FORGED duplicate of a
          # signed field (inserted BEFORE the authentic line) verify, and
          # benign accidental duplication (authentic first) must keep passing.
          # Run against the committed fixture (signed with throwaway pk=2).
          python3 - <<'EOF'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('ek', 'ethkey.py')
          ek = importlib.util.module_from_spec(spec); spec.loader.exec_module(ek)
          good = open('proofs/c12-dup-field-fixture.md').read()
          FORGED = {'created': '2020-01-01T00:00:00Z', 'sha256': '0'*64,
                    'signer': '0x' + 'ab'*20, 'signature': '0x' + '11'*65}
          def ins(md, f, v, before=True):
              L = md.splitlines(); i = next(j for j,l in enumerate(L) if l.startswith(f+':'))
              L.insert(i if before else i+1, f + ': ' + v if before else L[i]); return '\n'.join(L)+'\n'
          fails = 0
          for f, v in FORGED.items():
              ok, _, r = ek.verify_proof(ins(good, f, v))
              print(('PASS' if not ok else 'FAIL') + f' | forged-{f}-first | {r}')
              fails += ok
          for f in FORGED:
              ok, _, r = ek.verify_proof(ins(good, f, None, before=False))
              print(('PASS' if ok else 'FAIL') + f' | benign-dup-{f}-after | {r}')
              fails += not ok
          ok, _, r = ek.verify_proof(good)
          print(('PASS' if ok else 'FAIL') + ' | control-untouched')
          fails += not ok
          sys.exit(1 if fails else 0)
          EOF

      - name: receipt.html core logic tests (browser verifier vs CLI semantics)
        run: |
          set -euo pipefail
          SCRATCH=$(mktemp -d); cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          cat > t.mjs <<'EOF'
          import fs from 'fs';
          import nodeCrypto from 'node:crypto';
          import { verifyMessage } from 'ethers';
          if (!globalThis.crypto) globalThis.crypto = nodeCrypto.webcrypto;
          const REPO = process.argv[2];
          const html = fs.readFileSync(REPO + '/receipt.html', 'utf8');
          const m = html.match(/\/\/ ---- CORE BEGIN ----[^\n]*\n([\s\S]*?)\/\/ ---- CORE END ----/);
          if (!m) { console.error('CORE block not found in receipt.html'); process.exit(1); }
          globalThis.ethers = { verifyMessage };
          const core = new Function(m[1] + '; return { verifyReceipt, verKey, sortVersionedDesc };')();
          const good = fs.readFileSync(REPO + '/proofs/v0.4-source.md', 'utf8');
          let fails = 0;
          const T = (n, c, d) => { console.log((c ? 'PASS' : 'FAIL') + ' | ' + n + (d && !c ? ' | ' + d : '')); if (!c) fails++; };
          // version-sort unit tests (c13: loadSample resolves tags/files by these)
          {
            const sv = core.sortVersionedDesc(['v0.4-a.md', 'v0.10-a.md', 'v0.9-a.md', 'v0.10.2-a.md', 'fixture-no-ver.md']);
            T('sort: v0.10.2 > v0.10 > v0.9 > v0.4 > no-version',
              sv.join(',') === 'v0.10.2-a.md,v0.10-a.md,v0.9-a.md,v0.4-a.md,fixture-no-ver.md', sv.join(','));
            const k = core.verKey('c12-dup-field-fixture.md');
            T('verKey: no vX.Y keys as [0,0,0]', k.join() === '0,0,0', k.join());
          }
          const has = (r, n) => r.checks.some(c => c.name === n && c.ok);
          const no  = (r, n) => r.checks.some(c => c.name === n && !c.ok);
          let r = await core.verifyReceipt(good, '');
          T('valid receipt ok', r.ok && !no(r,'payload') && !no(r,'signature') && !no(r,'signer'), JSON.stringify(r.checks));
          r = await core.verifyReceipt(good, '0xf232Dcdc177b53981b4D805A48C79F239DB8D0F9');
          T('require correct addr ok', r.ok && has(r,'require'));
          r = await core.verifyReceipt(good, '0x0000000000000000000000000000000000000000');
          T('require wrong addr rejected', !r.ok && no(r,'require'));
          const lines = good.split('\n');
          const bi = lines.findIndex(l => l.trim() === '-----BEGIN PAYLOAD-----');
          lines[bi + 1] = 'ZQ==' + lines[bi + 1].slice(4);
          r = await core.verifyReceipt(lines.join('\n'), '');
          T('tampered payload rejected', !r.ok && no(r,'payload'));
          r = await core.verifyReceipt(good.replace(/^signer: .*/m, 'signer: 0x0000000000000000000000000000000000000000'), '');
          T('signer header swap rejected', !r.ok && no(r,'signer'));
          r = await core.verifyReceipt('not a receipt', '');
          T('garbage rejected without crashing', !r.ok);
          // duplicate-field parity with python matrix (c12): forged-first must fail,
          // benign duplicate-after must pass, on the committed fixture.
          const fx = fs.readFileSync(REPO + '/proofs/c12-dup-field-fixture.md', 'utf8');
          const FORGED = { created: '2020-01-01T00:00:00Z', sha256: '0'.repeat(64),
                           signer: '0x' + 'ab'.repeat(20), signature: '0x' + '11'.repeat(65) };
          const ins = (md, f, v, before) => { const L = md.split('\n');
            const i = L.findIndex(l => l.startsWith(f + ':'));
            L.splice(before ? i : i + 1, 0, before ? f + ': ' + v : L[i]); return L.join('\n'); };
          for (const [f, v] of Object.entries(FORGED)) {
            const q = await core.verifyReceipt(ins(fx, f, v, true), '');
            T('forged-' + f + '-first rejected', !q.ok);
          }
          for (const f of Object.keys(FORGED)) {
            const q = await core.verifyReceipt(ins(fx, f, null, false), '');
            T('benign-dup-' + f + '-after accepted', q.ok);
          }
          console.log(fails ? fails + ' FAILURES' : 'receipt.html core OK');
          process.exit(fails ? 1 : 0);
          EOF
          node t.mjs "$GITHUB_WORKSPACE"
