name: selftest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogfood:
    runs-on: ubuntu-latest
    env:
      # Well-known public test key (all 0x46 bytes). Safe to expose: it is a
      # published test vector, not a real key.
      ETHKEY_PK: "0x4646464646464646464646464646464646464646464646464646464646464646"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # full history: scripts/check-sitemap-git-truth.py compares each
          # sitemap lastmod against that page's last commit date (A c28 /
          # B c22 stale-companion class)
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependency
        run: pip install pycryptodome

      - name: Run built-in selftest
        run: python3 ethkey.py selftest

      - name: Sign / recover round-trip
        run: |
          set -euo pipefail
          MSG='CI roundtrip'
          SIG=$(python3 ethkey.py sign "$MSG")
          echo "signature: $SIG"
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          echo "address: $ADDR"
          # recover exits 0 when the claimed address matches, 1 when it does not
          python3 ethkey.py recover "$ADDR" "$MSG" "$SIG"
          # negative control: recovering against a wrong address must fail (exit 1)
          if python3 ethkey.py recover "0x0000000000000000000000000000000000000000" "$MSG" "$SIG"; then
            echo "FAIL: recover matched a wrong address"
            exit 1
          fi
          echo "round-trip and negative control OK"

      - name: Cross-check signatures against ethers.js v6
        run: |
          set -euo pipefail
          MSG='CI roundtrip'
          SIG=$(python3 ethkey.py sign "$MSG")
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          node -e 'const { ethers } = require("ethers");
            const [msg, sig, addr] = process.argv.slice(1);
            const recovered = ethers.verifyMessage(msg, sig);
            console.log("ethers.verifyMessage:", recovered);
            if (recovered.toLowerCase() !== addr.toLowerCase()) {
              console.error("FAIL: ethers recovered", recovered, "expected", addr);
              process.exit(1);
            }
            console.log("ethers.js v6 cross-check OK");' "$MSG" "$SIG" "$ADDR"

      - name: Signed proof round-trip + ethers cross-check
        run: |
          set -euo pipefail
          python3 ethkey.py proof --file ethkey.py --note "CI proof" --out proof.md
          ADDR=$(python3 ethkey.py address "$ETHKEY_PK")
          python3 ethkey.py verify proof.md --require "$ADDR"
          # negative control: tamper with payload -> verify must exit 1
          python3 - <<'EOF'
          import re, subprocess, sys
          md = open('proof.md').read()
          m = re.search(r'-----BEGIN PAYLOAD-----\n(.*?)-----END PAYLOAD-----', md, re.S)
          body = m.group(1).replace('\n', '')
          body = body[:-4] + ('A' if body[-1] != 'A' else 'B') + body[-4:]
          open('proof.md','w').write(md.replace(m.group(1), body))
          EOF
          if python3 ethkey.py verify proof.md; then
            echo "FAIL: tampered proof verified"
            exit 1
          fi
          # ethers cross-check of the untampered signature over the canonical string
          rm proof.md
          python3 ethkey.py proof --file ethkey.py --note "CI proof" --out proof.md
          PROOF=$PWD/proof.md
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y >/dev/null
          npm install ethers@6 --no-audit --no-fund >/dev/null
          node -e 'const { ethers } = require("ethers");
            const fs = require("fs");
            const md = fs.readFileSync(process.argv[1], "utf8");
            const g = (k) => md.match(new RegExp("^" + k + ": (.+)$", "m"))[1].trim();
            const canon = `ethkey-lite-proof v1\ncreated:${g("created")}\nsha256:${g("sha256")}`;
            const rec = ethers.verifyMessage(canon, g("signature"));
            console.log("ethers proof signer:", rec);
            if (rec.toLowerCase() !== g("signer").toLowerCase()) {
              console.error("FAIL: ethers proof signer mismatch");
              process.exit(1);
            }
            console.log("ethers proof cross-check OK");' "$PROOF"

      - name: Documented CLI surfaces (new/checksum/ENVKEY_PK-refusal/all-receipts)
        run: |
          set -euo pipefail
          # README: `new` = "fresh keypair (stdout only)" and "writes nothing
          # to disk" — pin BOTH halves of that claim (c22 audit gap #3).
          DIRTY_BEFORE=$(git status --porcelain)
          NEWOUT=$(python3 ethkey.py new)
          PK=$(echo "$NEWOUT" | grep '^private_key_hex:' | sed 's/private_key_hex: //')
          echo "$PK" | grep -qE '^0x[0-9a-f]{64}$' || { echo "FAIL: pk not 0x+64hex"; exit 1; }
          [ "$(git status --porcelain)" = "$DIRTY_BEFORE" ] || { echo "FAIL: 'new' touched the worktree"; exit 1; }
          echo "OK: new -> well-formed pk, zero disk writes"
          # README: `checksum` CLI subcommand — pin the CLI WIRING (not just
          # the lib fn) against the canonical EIP-55 mixed-case vectors
          # (c22 audit gap #5).
          [ "$(python3 ethkey.py checksum 0x5aaeb6053f3e94c9b8a09fbc64729cb422580706)" = "0x5aAeb6053f3E94C9B8A09FbC64729CB422580706" ] || { echo "FAIL: EIP-55 vector 1"; exit 1; }
          [ "$(python3 ethkey.py checksum 0xfd4090e27c1f946ff01a265caa7d4aca662acc15)" = "0xFD4090e27C1f946Ff01a265cAa7d4ACA662acC15" ] || { echo "FAIL: EIP-55 vector 2"; exit 1; }
          echo "OK: checksum CLI matches EIP-55 spec vectors"
          # README: key via ETHKEY_PK env "never appears in argv" — pin the
          # REFUSAL branch: no env -> clean exit 2 naming ETHKEY_PK, no
          # traceback (c22 audit gap #6).
          set +e
          ERR=$(env -u ETHKEY_PK python3 ethkey.py sign hello 2>&1 >/dev/null); code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "FAIL: sign-without-env exited $code, expected 2"; exit 1; }
          case "$ERR" in *Traceback*) echo "FAIL: sign-without-env traceback"; exit 1;; esac
          case "$ERR" in *ETHKEY_PK*) ;; *) echo "FAIL: error doesn't name ETHKEY_PK"; exit 1;; esac
          echo "OK: sign without ETHKEY_PK -> exit 2, names the var, no traceback"
          # README: 'Every release ships a signed receipt' — every
          # version-named receipt in proofs/ must verify against the C signer
          # via the CLI, not just the JS core (c22 audit gaps #11/#12: v0.4
          # was JS-only, v0.6 was never read by any step).
          C_ADDR=0xf232dcdc177b53981b4d805a48c79f239db8d0f9
          N=0
          for f in proofs/v*.md; do
            python3 ethkey.py verify "$f" --require "$C_ADDR" >/dev/null
            N=$((N+1)); echo "OK: $f verifies via CLI --require"
          done
          [ "$N" -ge 4 ] || { echo "FAIL: only $N version receipts found (expected >=4)"; exit 1; }
          echo "OK: all $N version receipts pass CLI --require"

      - name: Doc surface pins (README fence quote-clean, sitemap/robots, link liveness)
        run: |
          set -euo pipefail
          # Gap #16: the README's OWN yaml fence must model the quoting rule it
          # preaches — every `require:` inside a fenced block carries quotes.
          python3 - <<'EOF'
          import re, sys
          src = open('README.md').read()
          blocks = re.findall(r'^```(?:yaml|yml)\n(.*?)^```', src, re.M | re.S)
          bad = []
          for b in blocks:
              for line in b.splitlines():
                  m = re.search(r'require:\s*(\S+)', line)
                  if m and not re.match(r'^["\']', m.group(1)):
                      bad.append(line.strip())
          assert bad == [], 'unquoted require: in README fence(s): ' + repr(bad)
          assert any('require:' in b for b in blocks), 'no require: example in any yaml fence'
          print(f'OK: {len(blocks)} yaml fences scanned, every require: quoted')
          EOF
          # Gap #26: robots must name the sitemap; every sitemap <loc> must
          # resolve 200 on the live Pages host AND map to a committed file.
          BASE=https://tianzhicdev.github.io/ethkey-lite
          grep -q "^Sitemap: ${BASE}/sitemap.xml" robots.txt || { echo 'FAIL: robots missing sitemap'; exit 1; }
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | while read -r L; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$L")
            [ "$code" = "200" ] || { echo "FAIL: sitemap loc $L -> $code"; exit 1; }
            P="${L#$BASE/}"; [ -z "$P" ] && P=index.html
            [ -f "$P" ] || { echo "FAIL: sitemap loc $L has no committed file $P"; exit 1; }
            echo "OK: sitemap loc live + file present ($P)"
          done
          # Gap #31: every EXTERNAL href on the three Pages surfaces must be
          # alive (dead outbound links are the cheapest trust leak to catch).
          # c30 widenings (claims-vs-pins audit): README's own URLs (its
          # deep-link + the two run permalinks) and the <script src> CDN URLs
          # (both verifier pages HARD-FAIL without ethers 6.13.2 — a dead
          # script tag is worse than a dead href) join the liveness set.
          for U in $( (grep -ohE 'href="https?://[^"]+"' index.html receipt.html verify.html \
                         | sed -e 's/^href="//' -e 's/"$//' -e 's/&amp;/\&/g'
                       grep -ohE '<script src="https?://[^"]+"' index.html receipt.html verify.html \
                         | sed -e 's/^<script src="//' -e 's/"$//'
                       grep -ohE 'https?://[^ )>"`'\'']+' README.md | sed -e 's/[.,)]*$//'
                      ) | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$U")
            [ "$code" = "200" ] || { echo "FAIL: outbound link $U -> $code"; exit 1; }
            echo "OK: outbound $U"
          done
          # c30 gap #1: README 'License: MIT' + landing 'MIT' badge were a
          # stranger-facing legal claim with ZERO artifact — no LICENSE file
          # existed. Pin: file committed AND the SPDX line is really MIT.
          [ -f LICENSE ] && head -3 LICENSE | grep -q '^MIT License$' \
            || { echo 'FAIL: README/index claim MIT license but no committed MIT LICENSE file'; exit 1; }
          echo "OK: LICENSE committed + matches the documented MIT claim"
          # c30 gap #9: consumer-facing version refs must not drift apart.
          # Extract @vX.Y from the README fence + landing snippet, assert all
          # equal, == the reusable workflow's ethkey-ref default (HEAD), and
          # == the tag the in-repo caller actually uses.
          python3 - <<'EOF'
          import re, sys
          readme = re.search(r'verify-release\.yml@(v\d+\.\d+(?:\.\d+)?)', open('README.md').read())
          index = re.search(r'verify-release\.yml@(v\d+\.\d+(?:\.\d+)?)', open('index.html').read())
          wfr = re.search(r"ethkey-ref:\s*\n(?:[^:\n]*\n)?\s*(?:description|required|type):\s*[^\n]*\n\s*(?:description|required|type):\s*[^\n]*\n\s*(?:description|required|type):\s*[^\n]*\n\s*default:\s*'?(v\d+\.\d+(?:\.\d+)?)'?",
                          open('.github/workflows/verify-release.yml').read())
          caller = re.search(r'verify-release\.yml@(v\d+\.\d+(?:\.\d+)?)',
                             open('.github/workflows/verify-caller-selftest.yml').read())
          refs = {'README': readme, 'index': index, 'ethkey-ref default': wfr, 'caller-selftest ref': caller}
          missing = [k for k, m in refs.items() if not m]
          assert not missing, f'FAIL: version ref not found in: {missing}'
          vals = {k: m.group(1) for k, m in refs.items()}
          assert len(set(vals.values())) == 1, f'FAIL: version refs drifted: {vals}'
          print(f'OK: consumer version refs consistent across 4 surfaces ({vals["README"]})')
          EOF

      - name: "c110 paste-edge doc-pin: README consumer fence is content-addressed + ref live-resolved (A c113 port)"
        run: |
          set -euo pipefail
          # The consumer COPIES the README fence verbatim — that's the paste
          # edge every version-string pin was blind to (A's c113 find ported):
          # a future edit to the pasted bytes (mutable tag swap, dropped
          # quote, drifted path) stays invisible to a drift matrix that only
          # compares extracted version strings. Pin the fence's OWN bytes:
          # sha256 measured off committed bytes pre-ship (D0 leg), asserted
          # here every run. Any intentional fence change MUST re-measure +
          # update the pin in the same commit (an honest, greppable ritual),
          # and the drift matrix below still catches an UN-updated ref.
          # A's c100 pin-doc law: this gate needs an allow-mark on its own
          # payload line because a bare 64-hex here is a content address,
          # exactly what the pin is. <!-- secretgate: allow sha256 content pin -->
          # NB the `export`: a plain assignment is shell-local and INVISIBLE
          # to the python heredoc's os.environ (c110 CI self-catch: green
          # locally only because my harness exported it by hand).
          export EXPECT_FENCE_SHA=1bfbba1c3a7bb3364411608bca406fb85039fcefe81e08d4cf82776f9876c1f5
          python3 - <<'EOF'
          import hashlib, re, sys
          src = open('README.md').read()
          blocks = re.findall(r'^```(?:yaml|yml)\n(.*?)^```', src, re.M | re.S)
          fences = [b for b in blocks if 'uses:' in b and 'verify-release.yml@' in b]
          assert len(fences) == 1, f'FAIL: expected exactly 1 consumer fence, got {len(fences)}'
          f = fences[0]
          got = hashlib.sha256(f.encode()).hexdigest()
          want = __import__('os').environ['EXPECT_FENCE_SHA']
          assert got == want, f'FAIL: README consumer fence bytes changed\\n  want {want}\\n  got  {got}\\n  re-measure + update the pin in the SAME commit'
          m = re.search(r'verify-release\.yml@(v[\d.]+)', f)
          assert m, 'FAIL: consumer fence lost its @vX.Y ref'
          print(f'OK: README consumer fence content-addressed ({got[:12]}…), ref {m.group(1)}')
          EOF
          # D2 leg: the fence ref must RESOLVE LIVE — a tag that 404s at
          # paste time is a dead-on-arrival install; a string-equality
          # matrix can't see a ref that exists nowhere.
          FENCE_REF=$(python3 -c "import re; print(re.search(r'verify-release\\.yml@(v[\\d.]+)', open('README.md').read()).group(1))")
          case "$FENCE_REF" in
            v[0-9]*.[0-9]*) : ;;
            *) echo "FAIL: fence ref malformed: $FENCE_REF"; exit 2 ;;
          esac
          RESP="$(curl -s "https://api.github.com/repos/tianzhicdev/ethkey-lite/contents/.github/workflows/verify-release.yml?ref=${FENCE_REF}")"
          printf '%s' "$RESP" | python3 -c '
          import base64, json, sys
          d = json.load(sys.stdin)
          assert "content" in d, f"FAIL: fence ref does not resolve live: {d.get(chr(34)+chr(34), d)}"
          body = base64.b64decode(d["content"]).decode()
          assert "workflow_call" in body, "FAIL: resolved workflow lost workflow_call (wrong file at ref?)"
          print("OK: fence ref resolves live at api.github.com + workflow_call present")'
          # D3 leg: drift matrix WIDENED 4 -> 6 surfaces — the reusable
          # workflow's HEADER-COMMENT paste form and the c106 alarm checkout
          # `ref:` join the equality set (both name a ref consumers copy or
          # gate at; neither was compared anywhere before c110).
          python3 - <<'EOF'
          import re
          pat = r'verify-release\.yml@(v\d+\.\d+(?:\.\d+)?)'
          readme = re.search(pat, open('README.md').read())
          index = re.search(pat, open('index.html').read())
          wfr = re.search(r"ethkey-ref:\s*\n(?:[^:\n]*\n)?\s*(?:description|required|type):\s*[^\n]*\n\s*(?:description|required|type):\s*[^\n]*\n\s*(?:description|required|type):\s*[^\n]*\n\s*default:\s*'?(v\d+\.\d+(?:\.\d+)?)'?",
                          open('.github/workflows/verify-release.yml').read())
          wfcomment = re.search(pat, open('.github/workflows/verify-release.yml').read())
          caller_y = open('.github/workflows/verify-caller-selftest.yml').read()
          caller = re.search(pat, caller_y)
          alarm = re.search(r'\bref:\s*(v\d+\.\d+(?:\.\d+)?)', caller_y)
          refs = {'README fence': readme, 'index snippet': index,
                  'ethkey-ref default': wfr, 'workflow header comment': wfcomment,
                  'caller-selftest uses-ref': caller, 'alarm checkout ref': alarm}
          missing = [k for k, m in refs.items() if not m]
          assert not missing, f'FAIL: version ref not found in: {missing}'
          vals = {k: m.group(1) for k, m in refs.items()}
          assert len(set(vals.values())) == 1, f'FAIL: version refs drifted across 6 surfaces: {vals}'
          print(f'OK: consumer version refs consistent across 6 surfaces ({vals["README fence"]})')
          EOF

      - name: "CI uses: refs are content addresses (B c31 tripwire, hardened port)"
        run: |
          set -euo pipefail
          # One layer OUT from the c31 engine pin: every uses: step this
          # repo's CI EXECUTES (workflows AND the composite's runs.steps)
          # must be a 40-hex sha, a local ./, or the same-repo
          # workflow_call ref. A movable @vN tag is the frozen-engine
          # float class one layer up (actions/checkout@v4's head IS a
          # force-movable backport branch — gh read-back 2026-08-31).
          # Pure-stdlib indent walk (the dogfood job has pycryptodome
          # only, PyYAML ABSENT — c21 blind-spot class; the walker is
          # cross-checked multiset-equal against PyYAML host-side, and
          # a PYTHONPATH-poisoned no-yaml run proves the runner shape
          # locally). Comment prose can't fake a step (B's c30
          # vacuous-RED lesson); zero steps collected = RED (c27
          # vacuous-green rule); PIN_ACTION_REF must agree with the
          # executing secretgate-action ref (leg 1 pins the EXECUTING
          # ref's bytes — same sha on both sides of secrets.yml).
          # c35 legs: visible-vs-collected HOLE tripwire (a uses: the walk
          # can see but can't map to a step = walker bug, RED) + per-job
          # COVERAGE vacuity (every job must own a steps: block or a
          # job-level uses: — phantom/lost-body job is RED even while
          # other jobs keep the zero-steps rail green).
          # c36 legs (from a subagent 'documented vs executed' audit, each
          # silent-green repro'd on disk before fixing): QUOTED keys
          # ("uses": x — GitHub's parser accepts them; old KEY_RE skipped
          # them so a disallowed tag hid in quotes) + block-scalar
          # indentation indicators (run: |2 body was NOT opaque; 'uses:'
          # leaked in as a fake step) + FLOW style ({steps: [{uses: …}]} —
          # valid GitHub YAML, invisible to walk AND hole leg at once; now
          # fail-closed RED at flow depth, benign flow like on: {…} stays
          # green).
          python3 scripts/workflow-pins.py

      - name: Page meta-surface contract (A c30 port, A c33 offer)
        run: |
          set -euo pipefail
          # A's c33 offer, executed: index.html is the SEO front door
          # and carried canonical + description only — no favicon, no
          # og:*, no twitter:*. A's check-page-meta.py (shape asserts:
          # each tag EXACTLY once, pairwise byte-equality with
          # <title>/description, placeholder-dialect sweep = my own
          # c22 class) ported with SITE_URL/SITE_NAME swapped; pairs
          # with this repo's c23 doc-pins step.
          python3 scripts/check-page-meta.py

      - name: Sitemap lastmod x git truth (A c28 port, multi-page)
        run: |
          set -euo pipefail
          # A's c28 offer, executed + generalized (their pin is
          # single-URL; this sitemap has 3 rows): every lastmod must
          # equal THAT page's last commit date — page edited without
          # its sitemap row going red (B c22 stale-companion class).
          # Needs fetch-depth: 0 (set on checkout above).
          python3 scripts/check-sitemap-git-truth.py

      - name: Release-parity credential selftest (c46, offline transport matrix)
        run: |
          set -euo pipefail
          # c46 (A c53 offer): the credential matrix runs BEFORE the live
          # parity leg and needs NO network — host-scope baits, cross-host
          # redirect strip + same-host twin, 4xx/5xx classifier. A missing
          # step here is a wiring defect: the flip harness greps this exact
          # run-line and goes RED when it disappears.
          python3 scripts/release-assets-parity.py --selftest

      - name: Release assets x committed proofs parity (c28 reverse-direction pin)
        env:
          # c43 (A c51 fleet offer): unauth api.github.com = 60/h per SHARED
          # runner IP - a STRUCTURAL cap, retries cannot fix exhaustion (their
          # hookpack run died on exactly this after 4 retries). Runner token =
          # 5000/h; the rail attaches it ONLY to exact-host api.github.com.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # c28 audit (B's stale-companion class, applied to MY surface):
          # README + landing claim 'Every release carries a signed receipt'
          # was pinned in ONE direction only - every proofs/v*.md verifies via
          # CLI. Nothing walked the REVERSE rails:
          #   (a) every GitHub release ASSET must exist in proofs/ byte-
          #       identically (silently re-uploading an altered asset = the
          #       bytes a stranger verifies != the bytes the repo shows);
          #   (b) every committed version receipt must be attached to its
          #       tag's release (committed-but-never-uploaded = claim is a
          #       lie for that tag);
          #   (c) an asset's version must equal its release tag's version.
          # Live baseline at ship time: 5 tags / 5 pairs, all byte-equal.
          # c43: logic moved VERBATIM to scripts/release-assets-parity.py +
          # host-scoped token auth, fail-closed CI wiring (missing token =
          # exit 2, no silent unauth carve-out), and 4xx fails fast
          # (structural != transient). --selftest proves the credential
          # matrix offline; flip harness ships next to the rail.
          python3 scripts/release-assets-parity.py

      - name: verify.html vectors x Python CLI + internal links + footer addr pins (audit #24/#25/#30)
        run: |
          set -euo pipefail
          # Gap #24: verify.html's embedded vectors were 'documented but never
          # executed' — the page verifies them with ethers at runtime; CI now
          # extracts the VECTORS block from the page VERBATIM (c21 pattern:
          # zero copy-paste drift possible) and re-verifies EVERY vector with
          # the Python CLI, so the live page's PASS badges and the CLI verdict
          # can never disagree.
          # Gap #25: internal (non-http) hrefs on the Pages landing must point
          # at committed files, and the deep-link require= value must equal the
          # FLEET table's ethkey-lite pin (the pair the c20 mismatch rule
          # enforces at runtime is now pinned in source too).
          # Gap #30: B's tip addr printed in the README must match shared/LEDGER.md.
          python3 - <<'EOF'
          import re, subprocess, sys
          from pathlib import Path

          # ---- #24: verify.html vectors x Python CLI ----
          vh = open('verify.html').read()
          m = re.search(r'const VECTORS = \[(.*?)\];', vh, re.S)
          assert m, 'verify.html: VECTORS block not found'
          vectors = re.findall(
              r'message:\s*"((?:[^"\\]|\\.)*)",\s*sig:\s*"([0-9a-fA-Fx]+)",\s*addr:\s*"([0-9a-fA-Fx]+)"',
              m.group(1))
          assert len(vectors) >= 3, f'expected >=3 vectors, got {len(vectors)}'
          for msg, sig, addr in vectors:
              msg_dec = msg.replace('\\"', '"').replace('\\\\', '\\')
              r = subprocess.run(
                  ['python3', 'ethkey.py', 'recover', addr, msg_dec, sig],
                  capture_output=True, text=True)
              assert r.returncode == 0, f'CLI rejects embedded vector {msg!r}: {r.stderr or r.stdout}'
              assert f'matches claimed address: True' in r.stdout, f'vector {msg!r} recovery mismatch'
              # flip: same vector vs a wrong addr must go exit 1 (non-vacuous CLI assert)
              wrong = '0x' + '00' * 20 if addr[2] != '0' else '0x' + '11' * 20
              r2 = subprocess.run(
                  ['python3', 'ethkey.py', 'recover', wrong, msg_dec, sig],
                  capture_output=True, text=True)
              assert r2.returncode == 1, f'wrong-addr control did NOT fail for {msg!r}'
          print(f'OK: {len(vectors)} verify.html vectors re-verified by the PYTHON CLI (+ wrong-addr controls exit 1)')

          # ---- #25: internal hrefs + deep-link pair pin ----
          idx = open('index.html').read()
          internal = re.findall(r'href="([^"#]+)"', idx)
          # c29: data: URIs (the favicon href) are self-contained, not file refs
          internal = [h for h in internal
                      if not h.startswith(('http://', 'https://', 'data:'))]
          assert len(internal) >= 2, f'expected internal links, got {internal}'
          fleet = open('receipt.html').read()
          pin = re.search(r"\{\s*repo:\s*'ethkey-lite',\s*signer:\s*'(0x[0-9a-fA-F]{40})'\s*\}", fleet)
          assert pin, 'receipt.html FLEET ethkey-lite pin not found'
          fleet_addr = pin.group(1).lower()
          for h in internal:
              h_un = h.replace('&amp;', '&')  # HTML-entity form in href attrs
              target = h_un.split('?', 1)[0]
              assert Path(target).is_file(), f'index.html internal href -> missing file: {h}'
              if 'require=' in h_un:
                  q = re.search(r'require=(0x[0-9a-fA-F]{40})', h_un)
                  assert q, f'deep-link require= malformed: {h}'
                  assert q.group(1).lower() == fleet_addr, \
                      f'deep-link require {q.group(1)} != FLEET ethkey-lite pin {fleet_addr}'
          print(f'OK: {len(internal)} internal hrefs on committed files; deep-link require == FLEET pin')

          # ---- #30: B tip addr in README vs shared LEDGER (same-repo check) ----
          # Fleet cross-check (README addr == shared/LEDGER.md B row) runs
          # out-of-band in agents/C: LEDGER lives in the money monorepo, not
          # this repo. Here we at least pin README vs this repo's own truth:
          # every 0x+40-hx addr in the README tip line must be a known signer
          # (A/C are FLEET-pinned; B is asserted externally).
          rd = open('README.md').read()
          ml = re.search(r'ETH A `(0x[0-9a-fA-F]{40})` · B `(0x[0-9a-fA-F]{40})` · C `(0x[0-9a-fA-F]{40})`', rd)
          assert ml, 'README tip line missing or reshaped'
          a_addr, b_addr, c_addr = ml.group(1), ml.group(2), ml.group(3)
          assert c_addr.lower() == fleet_addr, f'README C tip {c_addr} != FLEET ethkey-lite pin {fleet_addr}'
          sig_a = re.search(r"\{\s*repo:\s*'secretgate',\s*signer:\s*'(0x[0-9a-fA-F]{40})'\s*\}", fleet)
          assert a_addr.lower() == sig_a.group(1).lower(), 'README A tip != FLEET secretgate pin'
          assert re.fullmatch(r'0x[0-9a-fA-F]{40}', b_addr), 'README B tip malformed'
          print(f'OK: README tip line well-formed; C tip == FLEET pin; A tip == FLEET secretgate pin; B addr {b_addr[:8]}… checked vs LEDGER out-of-band')
          EOF

      - name: Library exports pin (README 'import cleanly' claim, audit #27)
        run: |
          set -euo pipefail
          # README promises the six library functions 'import cleanly if you
          # want to build on them'. Until c26 nothing executed that claim:
          # a rename/TypeError at import time would ship green. Fresh-process
          # import (proves NO side-effect stdout at import), every named export
          # callable, + one behavioral pin per export so the names can't point
          # at stubs.
          python3 - <<'EOF'
          import subprocess, sys, os
          # 1) import must be silent (no print-on-import side effects)
          r = subprocess.run([sys.executable, '-c',
              'import io, sys; buf = io.StringIO(); real = sys.stdout; sys.stdout = buf; '
              'import ethkey; sys.stdout = real; sys.exit(1 if buf.getvalue() else 0)'],
              capture_output=True, text=True, env={**os.environ, 'PYTHONPATH': os.getcwd()})
          assert r.returncode == 0, 'importing ethkey printed to stdout (side effect)'
          print('OK: import ethkey is silent (no print-on-import side effects)')
          # 2) all six README-named exports exist, are callable, and WORK
          r = subprocess.run([sys.executable, '-c', '''
          import ethkey
          names = ["sign_message", "recover_message", "checksum_address",
                   "address_from_pk", "keccak256", "mul"]
          for n in names:
              assert callable(getattr(ethkey, n, None)), n + " missing/not callable"
          assert ethkey.keccak256(b"").hex() == \
              "c5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470"
          assert ethkey.address_from_pk(1) == "0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf"
          assert ethkey.checksum_address("0x5aaeb6053f3e94c9b8a09fbc64729cb422580706") == \
              "0x5aAeb6053f3E94C9B8A09FbC64729CB422580706"
          sig = ethkey.sign_message(b"exports pin", 1)
          assert ethkey.recover_message(b"exports pin", sig) == ethkey.address_from_pk(1)
          assert ethkey.mul(2, ethkey.G) == ethkey.add(ethkey.G, ethkey.G)
          '''], capture_output=True, text=True, env={**os.environ, 'PYTHONPATH': os.getcwd()})
          assert r.returncode == 0, 'export behavior pin failed:\n' + r.stdout + r.stderr
          print('OK: all 6 README library exports callable + behavior-pinned (keccak/addr/checksum/sign-recover/ec-mul)')
          EOF

