            v0.8-strict-recover.md v0.9-multislice.md \
            c63-concat-fixture.md c68-bundle-tampered2.md \
            c68-bundle-trunc.md c68-bundle-signermix.md
          echo "OK: same-ref probe = 0 divergences (strictness invariant holds)"
          # VACUOUS-gate pin (A c34 upgrade, ported c30): a fixture-less run
          # must die exit 2, NEVER print 'agree' rows. The A c34 defect class:
          # --old v0.7 was treated as a PATH -> verify exited 2 on both sides
          # -> every row read 'agree (rc=2)' = false-green strictness claim.
          mkdir -p /tmp/c30-empty
