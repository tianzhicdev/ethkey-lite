          grep -q 'divergences=[1-9]' /tmp/probe_v07.out || { echo "FAIL: no divergence rows against historical lenient tool"; exit 1; }
          grep -q 'agree: .*baseline (rc=0)' /tmp/probe_v07.out || { echo "FAIL: ref-resolved v0.7 never verified a real receipt rc=0 (both-tools gate bypassed?)"; exit 1; }
