name: verify-caller-selftest

# IN-REPO caller for the reusable verify-release workflow.
#
# The README tells consumers to call
#   tianzhicdev/ethkey-lite/.github/workflows/verify-release.yml@vTAG
# via `uses:` at JOB level with `with:` inputs. Before c23 that documented
# path had NEVER been exercised in THIS repo — all prior proof lived in
# consumers' repos (A's two workflows), and the reusable workflow's `signer`
# JOB OUTPUT had never been read by any caller anywhere.
#
# This workflow is that missing consumer, pinned to the EXACT documented
# ref (@v1.1, same string the README fence + landing snippet print — a c30
# claims-vs-pins audit caught that it previously tracked @main, so the
# daily call never exercised the form consumers actually copy):
#   - job `verify` calls the reusable workflow with inputs (workflow_call)
#   - job `check_output` consumes `needs.verify.outputs.signer` — the output
#     wiring (outputs: signer: ${{ jobs.verify.outputs.signer }}) is only
#     proven non-empty if this second job passes on a real dispatch.
#
# Live evidence (c23 dispatches, see README 'Caller contract proven';
# receipt default rebased v0.7 -> v0.8 -> v0.9 -> v1.1 at each ship so the daily call
# gates the LATEST release receipt under the latest tool):
#   GREEN  : real v0.7 receipt  -> verify green + check_output green
#   RED    : forged fixture     -> verify FAILS, check_output is SKIPPED
#            (failure + zero-outputs propagate through `needs:` — a caller
#            can gate a release on this and trust the verdict)
#
# schedule (daily): a silent call of the gate against the real release receipt.
# A scheduled workflow_call logs NOTHING on success, so a quiet schedule =
# the README's exact snippet keeps working; the next green dispatch can be
# cross-referenced against it.
#
# c106 fail-closed EMPTY-GATE ALARM (job `empty_gate_alarm`): the c105 K7 leg
# proved the empty-require bless is closed END-TO-END, but only as a manual
# one-shot dispatch. A schedule CANNOT drive the workflow_call empty leg (the
# API default-substitution class found at c105), so the alarm hits the SAME
# refusal point from the tool's own args layer: it runs the tool at the
# DOCUMENTED pin (v1.1, the same string verify-release.yml's ethkey-ref
# default ships to consumers) against the real v1.1 receipt with a TRUE empty
# --require and FAILS unless the tool refuses (exit 2, message names the
# empty gate). Non-vacuity measured pre-push (c106 W3): the pre-fix v0.9 tool
# blesses this exact leg (rc=0 'result: OK'), so a green alarm means the fix
# is alive, not that the leg is dead. Daily schedule + dispatch: a RED alarm =
# the fleet-wide empty-gate bless (A's c105 find) has regressed at the pin
# every consumer copies.

on:
  workflow_dispatch:
    inputs:
      receipt:
        description: Receipt path to gate (default = real v1.1 receipt)
        required: false
        type: string
        default: proofs/v1.1-workflow-defaults.md
      # c105: the workflow_dispatch API substitutes an input's field DEFAULT
      # when the JSON value is "" (measured twice: a require:'' dispatch of
      # verify-release logged REQUIRE: <default addr> = a true-gate run). The
      # workflow_call empty-gate leg was therefore UNDRIVABLE from the API.
      # This sentinel input makes it drivable from the caller side: 'EMPTY'
      # maps to a true empty string at the workflow_call boundary.
      require_addr:
        description: "Signer gate addr; 'EMPTY' drives the empty-require leg (must FAIL)"
        required: false
        type: string
        default: "0xf232dcdc177b53981b4d805a48c79f239db8d0f9"
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: read

jobs:
  # VERBATIM documented README form (only the receipt path is parameterized).
  verify:
    uses: tianzhicdev/ethkey-lite/.github/workflows/verify-release.yml@v1.1
    with:
      receipt: ${{ inputs.receipt || 'proofs/v1.1-workflow-defaults.md' }}
      # NB: GitHub expressions treat '' as FALSY, so the tempting
      # `cond && '' || x` collapses to x and would hand the tool the literal
      # 'EMPTY'. The empty string is produced AFTER selection by fromJSON.
      require: ${{ fromJSON(inputs.require_addr == 'EMPTY' && '[""]' || '["0xf232dcdc177b53981b4d805a48c79f239db8d0f9"]')[0] }}

  # Proves the signer JOB OUTPUT wiring: this job only runs if `verify`
  # succeeded, and it fails if the reusable workflow's outputs map came back
  # empty (the class of failure where a called-workflow output is declared
  # but never actually populated).
  check_output:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Assert reusable-workflow signer job output
        env:
          SIGNER: ${{ needs.verify.outputs.signer }}
        run: |
          set -euo pipefail
          echo "caller saw outputs.signer = [$SIGNER]"
          test -n "$SIGNER" || { echo "FAIL: reusable workflow produced empty signer output"; exit 1; }
          # CONTRACT NOTE (found by this job's first live run, 33336191895):
          # the output carries the tool's EIP-55 CHECKSUMMED casing
          # (0xf232Dcdc…), while `require` matching inside verify-release is
          # lowercase-compared. Callers must case-fold before comparing —
          # a byte-equality assert against a lowercase addr dies here red.
          LOWER=$(printf '%s' "$SIGNER" | tr 'A-Z' 'a-z')
          test "$LOWER" = "0xf232dcdc177b53981b4d805a48c79f239db8d0f9" || { echo "FAIL: signer output != C wallet addr (case-folded)"; exit 1; }
          echo "OK: workflow_call inputs + signer job-output wiring proven from the caller side (case-folded compare)"

  # c106 fail-closed EMPTY-GATE ALARM. Runs on the daily schedule AND after
  # `verify` on any dispatch (needs: verify keeps the alarm's verdict
  # independent of the gate leg it accompanies). It checks out the tool AT THE
  # DOCUMENTED PIN v1.1 (single checkout: the tag carries tool + receipt),
  # then demands the args-layer refusal for a TRUE empty --require. A rc
  # alone is transport (missing file, wrong python), so the refusal MESSAGE
  # must also appear. If this job goes RED, the empty-gate bless A found at
  # c105 is alive again at the exact ref consumers copy — every release gate
  # fleet-wide is suspect until re-proven.
  empty_gate_alarm:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ethkey-lite at the documented pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v1.1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install --quiet pycryptodome
      - name: Empty --require against real v1.1 receipt MUST be refused
        run: |
          set -euo pipefail
          # Teeth measured pre-push (c106 W3): pre-fix v0.9 tool blesses this
          # exact leg (rc=0, result: OK) — so PASS here is not vacuous.
          set +e
          OUT="$(python3 ethkey.py verify proofs/v1.1-workflow-defaults.md --require '' 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" -eq 2 ] && printf '%s' "$OUT" | grep -q -- '--require value is empty'; then
            echo "OK: empty-gate refusal alive at pin v1.1 (rc=2 + refusal message)"
          else
            echo "FAIL: empty --require was NOT refused (rc=$RC) — empty-gate bless regression"
            exit 1
          fi
